name: Build sky-mask staging image (no deploy)

on:
  push:
    branches:
      - feature/sky-only-ai-cutout
    paths:
      - "apps/api/**"
      - "scripts/deploy-sky-mask-staging.sh"
      - ".github/workflows/build-sky-mask-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sky-mask-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-staging-image:
    name: Build Docker on GitHub and push to ACR
    # Never deploy from this workflow: production shares the existing dev API.
    if: github.ref == 'refs/heads/feature/sky-only-ai-cutout'
    runs-on: ubuntu-latest
    env:
      ACR_NAME: cad443269256acr
      IMAGE_REPOSITORY: starkeepsake-api

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Verify branch and Docker source
        run: |
          test "${GITHUB_REF}" = "refs/heads/feature/sky-only-ai-cutout"
          test -f apps/api/Dockerfile
          test -f apps/api/StarKeepsake.Api.csproj

      - name: Login to Azure via OIDC (no stored Azure password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log Docker into ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build API image locally on GitHub runner
        run: |
          set -euo pipefail
          TAG="sky-ai-${GITHUB_SHA:0:12}"
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPOSITORY}:${TAG}"
          docker build --file apps/api/Dockerfile --tag "$IMAGE" apps/api
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push only the new SHA-tagged staging image
        run: |
          docker push "$IMAGE"
          echo "Image uploaded to ACR: $IMAGE"
          echo "No Container App was created or updated by this workflow."
