name: Deploy Design Engine to Azure

on:
  push:
    branches:
      - main
    paths:
      - "services/design-engine/**"
      - ".github/workflows/deploy-design-engine-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-design-engine-azure
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-starkeepsake-dev
  AZURE_CONTAINER_APP_ENVIRONMENT: cae-starkeepsake-dev
  AZURE_CONTAINER_APP: starkeepsake-engine-dev
  ACR_NAME: cad443269256acr
  IMAGE_NAME: starkeepsake-engine
  TARGET_PORT: "8080"
  ACR_PULL_IDENTITY_ID: /subscriptions/23e13257-9e0b-4cd0-9c57-01799ce82243/resourcegroups/rg-starkeepsake-dev/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-starkeepsake-acr-pull-dev

jobs:
  deploy:
    name: Build and deploy Python design engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sign in to Azure with OIDC
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push design-engine image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          ACR_SERVER="${ACR_NAME}.azurecr.io"
          IMAGE="${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --file services/design-engine/Dockerfile --tag "$IMAGE" services/design-engine
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Create or update Azure Container App
        shell: bash
        run: |
          set -euo pipefail
          ACR_SERVER="${ACR_NAME}.azurecr.io"

          if az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" >/dev/null 2>&1; then
            az containerapp identity assign --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --user-assigned "$ACR_PULL_IDENTITY_ID" --output none
            az containerapp registry set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --server "$ACR_SERVER" --identity "$ACR_PULL_IDENTITY_ID" --output none
            az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --image "$IMAGE" --set-env-vars "DEPLOYMENT_COMMIT_SHA=$GITHUB_SHA" --output none
            az containerapp ingress update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --target-port "$TARGET_PORT" --transport auto --output none
          else
            az containerapp create --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --environment "$AZURE_CONTAINER_APP_ENVIRONMENT" --image "$IMAGE" --user-assigned "$ACR_PULL_IDENTITY_ID" --registry-server "$ACR_SERVER" --registry-identity "$ACR_PULL_IDENTITY_ID" --ingress external --target-port "$TARGET_PORT" --env-vars "DEPLOYMENT_COMMIT_SHA=$GITHUB_SHA" --output none
          fi

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          HEALTH_URL="https://${FQDN}/health"

          for attempt in {1..30}; do
            BODY="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"

            DEPLOYED_SHA="$(echo "$BODY" | jq -r '.commitSha // empty')"

            if echo "$BODY" | grep -q '"service":"design-engine"' &&
               echo "$BODY" | grep -q '"status":"healthy"' &&
               [[ "$DEPLOYED_SHA" == "$GITHUB_SHA" ]]; then
              echo "Design engine health check passed for commit $DEPLOYED_SHA: $BODY"
              exit 0
            fi

            echo "Health check attempt $attempt/30 has not reached commit $GITHUB_SHA yet."
            sleep 10
          done

          echo "Design engine did not become healthy at $HEALTH_URL"
          exit 1


      - name: Smoke test M5 astronomy
        shell: bash
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          BASE_URL="https://${FQDN}"

          EXACT_REQUEST='{"date":"2024-07-04","utcDateTime":"2024-07-05T01:30:00Z","exactTimeUnknown":false,"timeZoneId":"America/Chicago","latitude":41.8781,"longitude":-87.6298,"magnitudeLimit":6.0,"maxStars":96,"minSeparationMm":3.5}'

          EXACT_RESPONSE="$(curl --fail --silent --show-error             -H "Content-Type: application/json"             -d "$EXACT_REQUEST"             "$BASE_URL/astronomy/stars")"

          echo "$EXACT_RESPONSE" | jq -e '
            .calculation.catalog == "hipparcos" and
            .calculation.ephemeris == "de440s" and
            .calculation.projection == "altaz-equirectangular" and
            .calculation.timeBasis == "exact" and
            .calculation.selectedStars > 20 and
            .calculation.selectedStars <= 96 and
            (.stars | length) == .calculation.selectedStars and
            ([.stars[] | select(.xMm < 6 or .xMm > 273.4 or .yMm < 6 or .yMm > 167.132)] | length) == 0 and
            (.stars[0].hipparcosId | type == "number")
          ' >/dev/null

          UNKNOWN_REQUEST='{"date":"2024-07-04","utcDateTime":null,"exactTimeUnknown":true,"timeZoneId":"America/Chicago","latitude":41.8781,"longitude":-87.6298,"magnitudeLimit":6.0,"maxStars":96,"minSeparationMm":3.5}'

          UNKNOWN_RESPONSE="$(curl --fail --silent --show-error             -H "Content-Type: application/json"             -d "$UNKNOWN_REQUEST"             "$BASE_URL/astronomy/stars")"

          echo "$UNKNOWN_RESPONSE" | jq -e '
            .calculation.timeBasis == "date-only-local-midnight" and
            .calculation.calculationUtcDateTime == "2024-07-04T05:00:00Z" and
            .calculation.selectedStars > 20
          ' >/dev/null

          echo "M5 astronomy smoke test passed."

      - name: Smoke test M6 engraving preview
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          INPUT="$(mktemp --suffix=.png)"
          OUTPUT="$(mktemp --suffix=.png)"
          trap 'rm -f "$INPUT" "$OUTPUT"' EXIT

          # Tiny synthetic gradient fixture; no customer photo or test assets stored.
          python3 - "$INPUT" <<'PY'
          import struct
          import sys
          import zlib
          width, height = 128, 128
          rows = b"".join(
              b"\x00" + bytes(((x * 2 + y) % 256 for x in range(width)))
              for y in range(height)
          )
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 0, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(rows))
              + chunk(b"IEND", b"")
          )
          with open(sys.argv[1], "wb") as output:
              output.write(png)
          PY

          curl --fail --silent --show-error \
            -F "image=@$INPUT;type=image/png" \
            -o "$OUTPUT" \
            "https://${FQDN}/engraving/preview"

          python3 - "$OUTPUT" <<'PY'
          import struct
          import sys
          with open(sys.argv[1], "rb") as f:
              data = f.read(33)
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "Not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (1604, 853), (width, height)
          assert data[25] == 0, "Expected 8-bit grayscale output"
          print("M6 engine engraving smoke test passed.")
          PY

      - name: Smoke test all frame geometry presets
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          for PRESET in 8x10 11x14 16x20; do
            REQUEST="$(jq -nc --arg id "$PRESET" '{
              date:"2024-07-04",utcDateTime:"2024-07-05T01:30:00Z",
              exactTimeUnknown:false,timeZoneId:"America/Chicago",
              latitude:41.8781,longitude:-87.6298,
              magnitudeLimit:6,maxStars:96,minSeparationMm:3.5,framePresetId:$id
            }')"
            RESPONSE="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "$REQUEST" "https://${FQDN}/astronomy/stars")"
            case "$PRESET" in
              8x10) MAX_X=198.2; MAX_Y=119.38 ;;
              11x14) MAX_X=273.4; MAX_Y=167.132 ;;
              16x20) MAX_X=398.4; MAX_Y=238.76 ;;
            esac
            echo "$RESPONSE" | jq -e --argjson maxX "$MAX_X" --argjson maxY "$MAX_Y" '
              .calculation.projection == "altaz-equirectangular" and
              .calculation.selectedStars > 20 and
              ([.stars[] | select(.xMm > $maxX or .yMm > $maxY)] | length) == 0
            ' >/dev/null
            echo "Frame preset $PRESET astronomy geometry passed"
          done
