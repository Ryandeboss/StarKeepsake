name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:crop
      - run: npm run test:stars
      - run: npm run test:sky-blend
      - run: npm run test:frame
      - run: npm run test:globe
      - run: npm run test:observer
      - run: npm run test:landscapes
      - run: npm run test:photo-panorama
      - run: npm run test:sky-cutout
      - run: npm run test:sky-mask-editor
      - run: npm run test:sky-ai-mask
      - run: npm run test:sky-recovery
      - run: npm run test:sky-spot
      - run: npm run test:sky-sweep
      - run: npm run test:photo-sky-layout
      - run: npm run test:experience
      - run: npm run test:workshop
      - run: npm run test:orders
      - run: npm run test:saved-design
      - run: npm run test:sky-placement
      - run: npm run test:chapter-nav
      - run: npm run test:local-draft
      - run: npm run test:showroom
      - run: npm run test:sky-dome
      - run: npm run test:photographic
      - run: npm run build

  api:
    name: ASP.NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore StarKeepsake.slnx
      - run: dotnet build StarKeepsake.slnx --no-restore --configuration Release
      - run: dotnet run --project tests/DesignSave.Tests/DesignSave.Tests.csproj --configuration Release
      - run: dotnet run --project tests/EtsyProduction.Tests/EtsyProduction.Tests.csproj --configuration Release
      - run: dotnet run --project tests/EtsyOAuth.Tests/EtsyOAuth.Tests.csproj --configuration Release
      - run: bash -n scripts/etsy/prepare-container-app.sh

  design-engine:
    name: Design Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/design-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -c "from main import app; assert app.title == 'StarKeepsake Design Engine'"
      - run: .venv/bin/python -m unittest discover -s tests -v

  physical-prototype:
    name: M4 Offline Prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/prototype/tests -v
