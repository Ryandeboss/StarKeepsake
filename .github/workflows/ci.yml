name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:crop
      - run: npm run test:stars
      - run: npm run build

  api:
    name: ASP.NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore StarKeepsake.slnx
      - run: dotnet build StarKeepsake.slnx --no-restore --configuration Release

  design-engine:
    name: Design Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/design-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -c "from main import app; assert app.title == 'StarKeepsake Design Engine'"
      - run: .venv/bin/python -m unittest discover -s tests -v
