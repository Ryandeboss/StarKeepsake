name: Deploy API to Azure

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-azure
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-starkeepsake-dev
  AZURE_CONTAINER_APP: starkeepsake-api-dev
  AZURE_MAPS_ACCOUNT: starkeepsake-maps-dev-23e13257
  ACR_NAME: cad443269256acr
  IMAGE_NAME: starkeepsake-api
  TARGET_PORT: "8080"

jobs:
  deploy:
    name: Build and deploy ASP.NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sign in to Azure with OIDC
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Maps and configure API secret
        shell: bash
        run: |
          set -euo pipefail

          MAPS_PROVIDER_STATE="$(az provider show             --namespace Microsoft.Maps             --query registrationState             --output tsv)"

          if [[ "$MAPS_PROVIDER_STATE" != "Registered" ]]; then
            echo "Microsoft.Maps is not registered for this subscription."
            echo "Run: az provider register --namespace Microsoft.Maps --wait"
            exit 1
          fi

          if ! az maps account show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_MAPS_ACCOUNT"             >/dev/null 2>&1; then
            az maps account create               --resource-group "$AZURE_RESOURCE_GROUP"               --name "$AZURE_MAPS_ACCOUNT"               --kind Gen2               --sku G2               --location westus2               --disable-local-auth false               --accept-tos               --output none
          fi

          MAPS_KEY="$(az maps account keys list             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_MAPS_ACCOUNT"             --query primaryKey             --output tsv)"

          if [[ -z "$MAPS_KEY" ]]; then
            echo "Azure Maps primary key could not be retrieved."
            exit 1
          fi

          echo "Azure Maps timezone response for Chicago (default options):"
          curl --fail --silent --show-error \
            -H "subscription-key: $MAPS_KEY" \
            "https://atlas.microsoft.com/timezone/byCoordinates/json?api-version=1.0&query=41.8781,-87.6298" \
            | jq .

          echo "Azure Maps timezone response for Chicago (options=all):"
          curl --fail --silent --show-error \
            -H "subscription-key: $MAPS_KEY" \
            "https://atlas.microsoft.com/timezone/byCoordinates/json?api-version=1.0&options=all&query=41.8781,-87.6298" \
            | jq .

          az containerapp secret set             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --secrets "azure-maps-key=$MAPS_KEY"             --output none

      - name: Build and push API image
        shell: bash
        run: |
          set -euo pipefail

          az acr login --name "$ACR_NAME"

          ACR_SERVER="${ACR_NAME}.azurecr.io"
          IMAGE="${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build             --file apps/api/Dockerfile             --tag "$IMAGE"             apps/api

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --image "$IMAGE"             --set-env-vars "AzureMaps__SubscriptionKey=secretref:azure-maps-key"             --output none

          az containerapp ingress update             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --target-port "$TARGET_PORT"             --transport auto             --output none

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --query properties.configuration.ingress.fqdn             --output tsv)"

          HEALTH_URL="https://${FQDN}/health"

          for attempt in {1..30}; do
            BODY="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"

            if echo "$BODY" | grep -q '"service":"StarKeepsake.Api"' &&
               echo "$BODY" | grep -q '"status":"healthy"'; then
              echo "API health check passed: $BODY"
              exit 0
            fi

            echo "Health check attempt $attempt/30 did not return the expected API payload."
            sleep 10
          done

          echo "API did not become healthy at $HEALTH_URL"
          exit 1

      - name: Smoke test location and moment resolution
        shell: bash
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --query properties.configuration.ingress.fqdn             --output tsv)"

          BASE_URL="https://${FQDN}"

          SEARCH_BODY_FILE="$(mktemp)"
          SEARCH_STATUS="$(curl --silent --show-error --output "$SEARCH_BODY_FILE" --write-out "%{http_code}" --get \
            "$BASE_URL/api/locations/search" \
            --data-urlencode "q=Chicago, IL")"
          SEARCH_RESPONSE="$(cat "$SEARCH_BODY_FILE")"

          if [[ "$SEARCH_STATUS" -lt 200 || "$SEARCH_STATUS" -ge 300 ]]; then
            echo "Location search failed with HTTP $SEARCH_STATUS"
            echo "$SEARCH_RESPONSE"
            exit 1
          fi

          CANDIDATE="$(echo "$SEARCH_RESPONSE" | jq -c '.[0]')"

          if [[ "$CANDIDATE" == "null" || -z "$CANDIDATE" ]]; then
            echo "Location search returned no candidate."
            echo "$SEARCH_RESPONSE"
            exit 1
          fi

          REQUEST_BODY="$(jq -n             --arg date "2024-07-04"             --arg time "20:30"             --arg query "Chicago, IL"             --argjson location "$CANDIDATE"             '{date:$date,time:$time,exactTimeUnknown:false,locationQuery:$query,location:$location}')"

          MOMENT_BODY_FILE="$(mktemp)"
          MOMENT_STATUS="$(curl --silent --show-error --output "$MOMENT_BODY_FILE" --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" \
            "$BASE_URL/api/moments/resolve")"
          MOMENT_RESPONSE="$(cat "$MOMENT_BODY_FILE")"

          if [[ "$MOMENT_STATUS" -lt 200 || "$MOMENT_STATUS" -ge 300 ]]; then
            echo "Moment resolution failed with HTTP $MOMENT_STATUS"
            echo "$MOMENT_RESPONSE"
            exit 1
          fi

          echo "$MOMENT_RESPONSE" | jq -e '
            .date == "2024-07-04" and
            .time == "20:30" and
            .exactTimeUnknown == false and
            (.location.latitude | type == "number") and
            (.location.longitude | type == "number") and
            (.location.timeZoneId | length > 0) and
            .localDateTime == "2024-07-04T20:30:00" and
            (.utcDateTime | endswith("Z"))
          ' >/dev/null

          echo "M4 smoke test passed."
