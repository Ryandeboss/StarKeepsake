name: Deploy API to Azure

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-azure
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-starkeepsake-dev
  AZURE_CONTAINER_APP: starkeepsake-api-dev
  AZURE_MAPS_ACCOUNT: starkeepsake-maps-dev-23e13257
  ACR_NAME: cad443269256acr
  IMAGE_NAME: starkeepsake-api
  TARGET_PORT: "8080"

jobs:
  deploy:
    name: Build and deploy ASP.NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sign in to Azure with OIDC
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Maps and configure API secret
        shell: bash
        run: |
          set -euo pipefail

          MAPS_PROVIDER_STATE="$(az provider show             --namespace Microsoft.Maps             --query registrationState             --output tsv)"

          if [[ "$MAPS_PROVIDER_STATE" != "Registered" ]]; then
            echo "Microsoft.Maps is not registered for this subscription."
            echo "Run: az provider register --namespace Microsoft.Maps --wait"
            exit 1
          fi

          if ! az maps account show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_MAPS_ACCOUNT"             >/dev/null 2>&1; then
            az maps account create               --resource-group "$AZURE_RESOURCE_GROUP"               --name "$AZURE_MAPS_ACCOUNT"               --kind Gen2               --sku G2               --location westus2               --disable-local-auth false               --accept-tos true               --output none
          fi

          MAPS_KEY="$(az maps account keys list             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_MAPS_ACCOUNT"             --query primaryKey             --output tsv)"

          if [[ -z "$MAPS_KEY" ]]; then
            echo "Azure Maps primary key could not be retrieved."
            exit 1
          fi

          az containerapp secret set             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --secrets "azure-maps-key=$MAPS_KEY"             --output none

      - name: Build and push API image
        shell: bash
        run: |
          set -euo pipefail

          az acr login --name "$ACR_NAME"

          ACR_SERVER="${ACR_NAME}.azurecr.io"
          IMAGE="${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build             --file apps/api/Dockerfile             --tag "$IMAGE"             apps/api

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --image "$IMAGE"             --set-env-vars "AzureMaps__SubscriptionKey=secretref:azure-maps-key"             --output none

          az containerapp ingress update             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --target-port "$TARGET_PORT"             --transport auto             --output none

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --query properties.configuration.ingress.fqdn             --output tsv)"

          HEALTH_URL="https://${FQDN}/health"

          for attempt in {1..30}; do
            BODY="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"

            if echo "$BODY" | grep -q '"service":"StarKeepsake.Api"' &&
               echo "$BODY" | grep -q '"status":"healthy"'; then
              echo "API health check passed: $BODY"
              exit 0
            fi

            echo "Health check attempt $attempt/30 did not return the expected API payload."
            sleep 10
          done

          echo "API did not become healthy at $HEALTH_URL"
          exit 1
