name: Deploy API to Azure

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-azure
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-starkeepsake-dev
  AZURE_CONTAINER_APP: starkeepsake-api-dev
  AZURE_MAPS_ACCOUNT: starkeepsake-maps-dev-23e13257
  ACR_NAME: cad443269256acr
  IMAGE_NAME: starkeepsake-api
  TARGET_PORT: "8080"

jobs:
  deploy:
    name: Build and deploy ASP.NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sign in to Azure with OIDC
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Maps and configure API secret
        shell: bash
        run: |
          set -euo pipefail

          MAPS_PROVIDER_STATE="$(az provider show             --namespace Microsoft.Maps             --query registrationState             --output tsv)"

          if [[ "$MAPS_PROVIDER_STATE" != "Registered" ]]; then
            echo "Microsoft.Maps is not registered for this subscription."
            echo "Run: az provider register --namespace Microsoft.Maps --wait"
            exit 1
          fi

          if ! az maps account show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_MAPS_ACCOUNT"             >/dev/null 2>&1; then
            az maps account create               --resource-group "$AZURE_RESOURCE_GROUP"               --name "$AZURE_MAPS_ACCOUNT"               --kind Gen2               --sku G2               --location westus2               --disable-local-auth false               --accept-tos               --output none
          fi

          MAPS_KEY="$(az maps account keys list             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_MAPS_ACCOUNT"             --query primaryKey             --output tsv)"

          if [[ -z "$MAPS_KEY" ]]; then
            echo "Azure Maps primary key could not be retrieved."
            exit 1
          fi

          az containerapp secret set             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --secrets "azure-maps-key=$MAPS_KEY"             --output none

      - name: Build and push API image
        shell: bash
        run: |
          set -euo pipefail

          az acr login --name "$ACR_NAME"

          ACR_SERVER="${ACR_NAME}.azurecr.io"
          IMAGE="${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build             --file apps/api/Dockerfile             --tag "$IMAGE"             apps/api

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --image "$IMAGE"             --set-env-vars "AzureMaps__SubscriptionKey=secretref:azure-maps-key" "Deployment__CommitSha=$GITHUB_SHA" "DesignEngine__BaseUrl=https://starkeepsake-engine-dev.wittyflower-9225f265.centralus.azurecontainerapps.io/"             --output none

          az containerapp ingress update             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --target-port "$TARGET_PORT"             --transport auto             --output none

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --query properties.configuration.ingress.fqdn             --output tsv)"

          HEALTH_URL="https://${FQDN}/health"

          for attempt in {1..30}; do
            BODY="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"

            DEPLOYED_SHA="$(echo "$BODY" | jq -r '.commitSha // empty')"

            if echo "$BODY" | grep -q '"service":"StarKeepsake.Api"' &&
               echo "$BODY" | grep -q '"status":"healthy"' &&
               [[ "$DEPLOYED_SHA" == "$GITHUB_SHA" ]]; then
              echo "API health check passed for commit $DEPLOYED_SHA: $BODY"
              exit 0
            fi

            echo "Health check attempt $attempt/30 has not reached commit $GITHUB_SHA yet."
            sleep 10
          done

          echo "API did not become healthy at $HEALTH_URL"
          exit 1

      - name: Smoke test location and moment resolution
        shell: bash
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --query properties.configuration.ingress.fqdn             --output tsv)"

          BASE_URL="https://${FQDN}"

          SEARCH_BODY_FILE="$(mktemp)"
          SEARCH_STATUS="$(curl --silent --show-error --output "$SEARCH_BODY_FILE" --write-out "%{http_code}" --get \
            "$BASE_URL/api/locations/search" \
            --data-urlencode "q=Chicago, IL")"
          SEARCH_RESPONSE="$(cat "$SEARCH_BODY_FILE")"

          if [[ "$SEARCH_STATUS" -lt 200 || "$SEARCH_STATUS" -ge 300 ]]; then
            echo "Location search failed with HTTP $SEARCH_STATUS"
            echo "$SEARCH_RESPONSE"
            exit 1
          fi

          CANDIDATE="$(echo "$SEARCH_RESPONSE" | jq -c '.[0]')"

          if [[ "$CANDIDATE" == "null" || -z "$CANDIDATE" ]]; then
            echo "Location search returned no candidate."
            echo "$SEARCH_RESPONSE"
            exit 1
          fi

          REQUEST_BODY="$(jq -n             --arg date "2024-07-04"             --arg time "20:30"             --arg query "Chicago, IL"             --argjson location "$CANDIDATE"             '{date:$date,time:$time,exactTimeUnknown:false,locationQuery:$query,location:$location}')"

          MOMENT_BODY_FILE="$(mktemp)"
          MOMENT_STATUS="$(curl --silent --show-error --output "$MOMENT_BODY_FILE" --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" \
            "$BASE_URL/api/moments/resolve")"
          MOMENT_RESPONSE="$(cat "$MOMENT_BODY_FILE")"

          if [[ "$MOMENT_STATUS" -lt 200 || "$MOMENT_STATUS" -ge 300 ]]; then
            echo "Moment resolution failed with HTTP $MOMENT_STATUS"
            echo "$MOMENT_RESPONSE"
            exit 1
          fi

          echo "$MOMENT_RESPONSE" | jq -e '
            .date == "2024-07-04" and
            .time == "20:30" and
            .exactTimeUnknown == false and
            (.location.latitude | type == "number") and
            (.location.longitude | type == "number") and
            (.location.timeZoneId | length > 0) and
            .localDateTime == "2024-07-04T20:30:00" and
            (.utcDateTime | endswith("Z"))
          ' >/dev/null

          echo "M4 smoke test passed."


      - name: Smoke test M5 public astronomy flow
        shell: bash
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_CONTAINER_APP"             --query properties.configuration.ingress.fqdn             --output tsv)"
          BASE_URL="https://${FQDN}"

          MOMENT='{"date":"2024-07-04","time":"20:30","exactTimeUnknown":false,"location":{"query":"Chicago, IL","displayName":"Chicago, IL","formattedAddress":"Chicago, IL","latitude":41.8781,"longitude":-87.6298,"timeZoneId":"America/Chicago","confidence":"High"},"localDateTime":"2024-07-04T20:30:00","utcDateTime":"2024-07-05T01:30:00Z"}'

          REQUEST="$(jq -n             --argjson moment "$MOMENT"             '{moment:$moment,skySettings:{background:"deep-space",brightness:1,showConstellation:true,projection:"azimuthal-equidistant",magnitudeLimit:6,maxStars:96,minSeparationMm:3.5}}')"

          RESPONSE_FILE="$(mktemp)"
          STATUS=""

          for attempt in {1..30}; do
            STATUS="$(curl --silent --show-error               --output "$RESPONSE_FILE"               --write-out "%{http_code}"               -H "Content-Type: application/json"               -d "$REQUEST"               "$BASE_URL/api/astronomy/stars")"

            if [[ "$STATUS" -ge 200 && "$STATUS" -lt 300 ]]; then
              break
            fi

            echo "M5 public astronomy attempt $attempt/30 returned HTTP $STATUS."
            sleep 10
          done

          RESPONSE="$(cat "$RESPONSE_FILE")"

          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "M5 public astronomy failed with HTTP $STATUS"
            echo "$RESPONSE"
            exit 1
          fi

          echo "$RESPONSE" | jq -e '
            .calculation.catalog == "hipparcos" and
            .calculation.ephemeris == "de440s" and
            .calculation.timeBasis == "exact" and
            .calculation.selectedStars > 20 and
            (.stars | length) == .calculation.selectedStars and
            (.stars[0].hipparcosId | type == "number")
          ' >/dev/null

          echo "M5 public astronomy smoke test passed."

          # A date-only design must stay explicitly approximate all the way
          # through the public API, including the correct local-to-UTC conversion.
          UNKNOWN_REQUEST="$(echo "$REQUEST" | jq -c '
            .moment.time = null |
            .moment.exactTimeUnknown = true |
            .moment.localDateTime = null |
            .moment.utcDateTime = null
          ')"

          UNKNOWN_RESPONSE_FILE="$(mktemp)"
          UNKNOWN_STATUS="$(curl --silent --show-error \
            --output "$UNKNOWN_RESPONSE_FILE" \
            --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$UNKNOWN_REQUEST" \
            "$BASE_URL/api/astronomy/stars")"

          UNKNOWN_RESPONSE="$(cat "$UNKNOWN_RESPONSE_FILE")"

          if [[ "$UNKNOWN_STATUS" -lt 200 || "$UNKNOWN_STATUS" -ge 300 ]]; then
            echo "M5 public date-only astronomy failed with HTTP $UNKNOWN_STATUS"
            echo "$UNKNOWN_RESPONSE"
            exit 1
          fi

          echo "$UNKNOWN_RESPONSE" | jq -e '
            .calculation.catalog == "hipparcos" and
            .calculation.ephemeris == "de440s" and
            .calculation.timeBasis == "date-only-local-midnight" and
            .calculation.calculationUtcDateTime == "2024-07-04T05:00:00Z" and
            .calculation.selectedStars > 20 and
            .calculation.selectedStars <= 96 and
            (.stars | length) == .calculation.selectedStars and
            (.stars | all(
              .hipparcosId >= 1 and
              .xMm >= 0 and .xMm <= 279.4 and
              .yMm >= 0 and .yMm <= 355.6 and
              .holeSizeMm > 0
            ))
          ' >/dev/null

          echo "M5 public date-only astronomy smoke test passed."

      - name: Smoke test M6 public engraving preview
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          INPUT="$(mktemp --suffix=.png)"
          OUTPUT="$(mktemp --suffix=.png)"
          trap 'rm -f "$INPUT" "$OUTPUT"' EXIT

          # Tiny synthetic gradient fixture; no customer photo or test assets stored.
          python3 - "$INPUT" <<'PY'
          import struct
          import sys
          import zlib
          width, height = 128, 128
          rows = b"".join(
              b"\x00" + bytes(((x * 2 + y) % 256 for x in range(width)))
              for y in range(height)
          )
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 0, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(rows))
              + chunk(b"IEND", b"")
          )
          with open(sys.argv[1], "wb") as output:
              output.write(png)
          PY

          curl --fail --silent --show-error \
            -F "image=@$INPUT;type=image/png" \
            -o "$OUTPUT" \
            "https://${FQDN}/api/engraving/preview"

          python3 - "$OUTPUT" <<'PY'
          import struct
          import sys
          with open(sys.argv[1], "rb") as f:
              data = f.read(33)
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "Not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (2100, 1250), (width, height)
          assert data[25] == 0, "Expected 8-bit grayscale output"
          print("M6 public engraving smoke test passed.")
          PY

          INVALID_STATUS="$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            -F "image=@$INPUT;type=text/plain" \
            "https://${FQDN}/api/engraving/preview")"
          [[ "$INVALID_STATUS" == "400" ]] || {
            echo "Expected unsupported media type to be rejected with HTTP 400; received $INVALID_STATUS"
            exit 1
          }
