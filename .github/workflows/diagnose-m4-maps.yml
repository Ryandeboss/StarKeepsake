name: Diagnose M4 Azure Maps

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-m4-maps.yml"

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-starkeepsake-dev
  AZURE_MAPS_ACCOUNT: starkeepsake-maps-dev-23e13257

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure with OIDC
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Call Azure Maps directly
        shell: bash
        run: |
          set -euo pipefail

          MAPS_KEY="$(az maps account keys list             --resource-group "$AZURE_RESOURCE_GROUP"             --name "$AZURE_MAPS_ACCOUNT"             --query primaryKey             --output tsv)"

          GEOCODE_RESPONSE="$(curl --fail --silent --show-error             -H "subscription-key: $MAPS_KEY"             "https://atlas.microsoft.com/geocode?api-version=2025-01-01&top=1&query=Chicago%2C%20Illinois")"

          echo "GEOCODE_RESULT:"
          echo "$GEOCODE_RESPONSE" | jq '{featureCount:(.features|length), geometry:.features[0].geometry, geocodePoints:.features[0].properties.geocodePoints}'

          echo "TIMEZONE_KNOWN_CHICAGO:"
          curl --fail --silent --show-error \
            -H "subscription-key: $MAPS_KEY" \
            "https://atlas.microsoft.com/timezone/byCoordinates/json?api-version=1.0&query=41.8781,-87.6298" | jq .

          LON="$(echo "$GEOCODE_RESPONSE" | jq -r '.features[0].geometry.coordinates[0]')"
          LAT="$(echo "$GEOCODE_RESPONSE" | jq -r '.features[0].geometry.coordinates[1]')"

          echo "TIMEZONE_EXACT_GEOCODE_COORDINATES: $LAT,$LON"
          curl --fail --silent --show-error \
            -H "subscription-key: $MAPS_KEY" \
            "https://atlas.microsoft.com/timezone/byCoordinates/json?api-version=1.0&query=$LAT,$LON" | jq .
